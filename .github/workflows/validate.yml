name: Validate prototype
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<14'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile tools/*.py tests/*.py
  windows-install:
    runs-on: windows-latest
    needs: assets
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check launcher syntax and install pinned engine
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/tools/setup.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          ./tools/setup.ps1 -InstallOnly
          if (-not $?) { throw 'Installation failed' }
          foreach ($file in @('Ikemen_GO.exe','chars/simon/simon.sff','chars/techblade/techblade.sff','data/eter/system.def','save/eter.ini')) {
            if (-not (Test-Path "runtime/$file")) { throw "Missing $file" }
          }
      - name: Run native command-line help on Windows
        shell: pwsh
        run: |
          Push-Location runtime
          try {
            '' | ./Ikemen_GO.exe -h | Out-File ../windows-help.txt
            if ($LASTEXITCODE -ne 0) { throw 'Native CLI failed' }
          } finally { Pop-Location }
          if (-not (Select-String -Path windows-help.txt -Pattern 'Options')) { throw 'Help output missing' }
      - name: Check player settings survive installation
        shell: pwsh
        run: |
          Add-Content runtime/save/eter.ini '; settings-preservation-check'
          ./tools/setup.ps1 -InstallOnly
          if (-not (Select-String -Path runtime/save/eter.ini -Pattern 'settings-preservation-check')) { throw 'Settings were overwritten' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-install-evidence
          path: windows-help.txt
      - name: Package Windows build and publish prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = "v$version"
          $folder = "CODE-ETER-COF-$tag"
          git archive --format=zip HEAD -o project-source.zip
          Expand-Archive project-source.zip "dist/$folder"
          # Use clean shipped defaults after the preservation test.
          Copy-Item game/data/eter/config.ini runtime/save/eter.ini -Force
          Copy-Item runtime "dist/$folder/runtime" -Recurse
          $zip = "CODE-ETER-COF-$tag-Windows.zip"
          Compress-Archive "dist/$folder" $zip -CompressionLevel Optimal
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Set-Content "$zip.sha256" -Encoding ascii
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "$tag already published; keeping its original files."; exit 0 }
          gh release create $tag $zip "$zip.sha256" --target $env:GITHUB_SHA --prerelease --title "Prototype $version" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
